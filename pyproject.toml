[project]
name = "production-level-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TayyabSiddique77", email = "tayyabsiddique77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn>=0.52.4",
]

[project.scripts]
production-level-project = "production_level_project:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
